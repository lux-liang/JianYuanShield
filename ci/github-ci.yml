name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: Syntax check & unit tests (no weights)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch (CI 不需要 GPU/CUDA)
        run: |
          pip install --upgrade pip
          pip install torch==2.4.1+cpu torchvision==0.19.1+cpu \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          # 跳过 torch/torchvision（上一步已安装 CPU 版本），其余依赖照常装
          grep -v "^torch" requirements.txt | pip install --no-cache-dir -r /dev/stdin
          # face_alignment 依赖较重，仅在有权重的环境才需真实推理，CI 跳过安装
          pip install --no-cache-dir \
            PyWavelets \
            kornia \
            easydict

      - name: Python syntax check (py_compile, 全仓 .py)
        run: |
          # 递归检查所有 .py 文件语法，torch.load/import torch 等运行期错误不在此验证
          find . -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            | sort \
            | xargs python3 -m py_compile \
            && echo "py_compile: all files OK"

      - name: Run smoke import test
        run: |
          python3 -m pytest tests/test_smoke_import.py -v --tb=short

      - name: Run unit tests (no weights required)
        run: |
          # 跳过需要真实权重的集成测试（如 test_backend.py 里的推理路径）
          python3 -m pytest \
            tests/test_attacks.py \
            tests/test_metrics.py \
            tests/test_protocol.py \
            tests/test_runtime_config.py \
            tests/test_signing.py \
            tests/test_statistics.py \
            tests/test_audit.py \
            tests/test_multi_embedding.py \
            -v --tb=short
        env:
          # 确保所有路径从环境变量派生，不硬连接 /data1
          JYS_PROJECT_ROOT: ${{ github.workspace }}
          JYS_MODEL_SOURCE_ROOT: ${{ github.workspace }}
          JYS_DATA_ROOT: ${{ github.workspace }}/datasets
          JYS_WEIGHT_ROOT: ${{ github.workspace }}/weights
          JYS_REPORT_ROOT: ${{ github.workspace }}/system/reports

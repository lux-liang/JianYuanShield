version: "3.9"

services:
  jianyuanshield:
    build: .
    image: jianyuanshield:latest
    container_name: jianyuanshield
    ports:
      - "8026:8026"   # FastAPI backend
      - "8027:8027"   # Static frontend
    volumes:
      # 本地权重目录（只读）：需在部署前手动将模型权重放入 ./weights/
      # 目录结构要求：./weights/mea/{SepMark,WaveGuard,HiDDeN,KAD-Net}/ 下各有对应 .pth 文件
      - ./weights:/app/weights:ro
      # 运行时数据：评测结果、报告、证据文件
      - ./runs:/app/runs
      - ./system/reports:/app/system/reports
      - ./system/assets:/app/system/assets
      # 外部模型源码/权重挂载点（由 JYS_MODEL_SOURCE_ROOT 指向）
      # 请将包含 MEA/LIDMark/WaveGuard/KAD-Net 源码及额外权重的目录挂载到此处
      # 若不挂载，容器内默认使用 /app/model_source（空目录，推理会 fallback 或报错）
      # 示例：将算力服务器上的 /data1/luxliang/work/vpsg_competition_candidates 替换为本地实际路径
      # - /path/to/your/model_source:/app/model_source:ro
    environment:
      - PYTHONPATH=/app
      - JYS_DATA_ROOT=/app/data
      - JYS_BACKEND_PORT=8026
      # JYS_MODEL_SOURCE_ROOT：推理时模型源码/权重根目录，须与上方 volume 挂载路径一致
      - JYS_MODEL_SOURCE_ROOT=/app/model_source
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8026/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
